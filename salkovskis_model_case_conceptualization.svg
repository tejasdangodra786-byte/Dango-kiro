<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1300" viewBox="0 0 960 1300" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title { font-weight: bold; font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
    .subtitle { font-weight: bold; font-size: 11px; fill: #1a1a1a; text-anchor: middle; }
    .body { font-size: 11px; fill: #333333; text-anchor: middle; }
    .caption { font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
    .heading { font-size: 20px; font-weight: bold; fill: #14497a; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="1300" fill="#ffffff"/>
  <text x="480" y="30" class="heading">Case Conceptualization - Salkovskis' Cognitive Model of OCD</text>
  <text x="480" y="50" class="caption">Mr. Rahul Ahirwar, 19 yrs</text>

  <!-- Row 1: Early experiences & Critical incidents -->
  <rect x="60" y="70" width="380" height="110" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="250" y="90" class="title">EARLY EXPERIENCES</text>
  <text x="250" y="104" class="body">(vulnerability factors)</text>
  <text x="250" y="122" class="body">Strong emotional dependency on</text>
  <text x="250" y="136" class="body">mother; high sensitivity to family</text>
  <text x="250" y="150" class="body">safety/harm; guilt-proneness &amp;</text>
  <text x="250" y="164" class="body">harsh, self-critical superego (TAT)</text>

  <rect x="520" y="70" width="380" height="110" rx="8" fill="#FFF9E6" stroke="#8a6d1a" stroke-width="1.5"/>
  <text x="710" y="90" class="title">CRITICAL INCIDENTS</text>
  <text x="710" y="104" class="body">(what started the OCD off)</text>
  <text x="710" y="122" class="body">Conflict involving paternal uncle</text>
  <text x="710" y="136" class="body">(~4 years ago) &#8594; began repetitive</text>
  <text x="710" y="150" class="body">thoughts of harm/negative</text>
  <text x="710" y="164" class="body">consequences befalling others</text>

  <text x="465" y="130" class="title">Activates</text>
  <line x1="440" y1="125" x2="520" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="250" y1="180" x2="480" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="710" y1="180" x2="480" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 2: Assumptions, general beliefs -->
  <rect x="230" y="220" width="500" height="110" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="480" y="240" class="title">ASSUMPTIONS, GENERAL BELIEFS</text>
  <text x="480" y="258" class="body">"If I think of harm coming to my family, I am responsible for it";</text>
  <text x="480" y="272" class="body">"Having a sexual thought means I am a bad/immoral person";</text>
  <text x="480" y="286" class="body">"Not neutralizing the thought is as bad as it coming true";</text>
  <text x="480" y="300" class="body">"Better safe (rub eyes/hold saliva) than sorry"</text>
  <text x="480" y="318" class="body" font-style="italic">(SSCT self-concept=16, family area=11: guilt &amp; dependency)</text>

  <line x1="480" y1="330" x2="480" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 3: Intrusive thoughts -->
  <rect x="230" y="365" width="500" height="95" rx="8" fill="#FDEDEC" stroke="#b03a2e" stroke-width="1.5"/>
  <text x="480" y="385" class="title">INTRUSIVE THOUGHTS, IMAGES, URGES, DOUBTS</text>
  <text x="480" y="403" class="body">Repeated negative thoughts about harm to family; intrusive</text>
  <text x="480" y="417" class="body">sexual thoughts about girls; disturbing visual replaying all day</text>
  <text x="480" y="435" class="body" font-weight="bold">Y-BOCS = 33 (Severe obsessions &amp; compulsions)</text>

  <!-- Down arrows to neutralizing / attention boxes -->
  <line x1="330" y1="460" x2="200" y2="510" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="630" y1="460" x2="760" y2="510" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <!-- Up arrows returning (bidirectional loop) -->
  <line x1="230" y1="500" x2="360" y2="465" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="730" y1="500" x2="600" y2="465" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 4: Neutralizing actions & Attention/reasoning biases -->
  <rect x="60" y="510" width="360" height="130" rx="8" fill="#E8F8F0" stroke="#1e7a4c" stroke-width="1.5"/>
  <text x="240" y="530" class="title">NEUTRALIZING ACTIONS</text>
  <text x="240" y="544" class="body">(rituals, reassurance, mental argument)</text>
  <text x="240" y="564" class="body">Repeated eye rubbing to "get rid" of the</text>
  <text x="240" y="578" class="body">thought/visual; avoiding swallowing</text>
  <text x="240" y="592" class="body">saliva so the negative thought cannot</text>
  <text x="240" y="606" class="body">"go inside" him</text>
  <text x="240" y="624" class="body" font-style="italic">-&gt; temporary, short-lived relief only</text>

  <rect x="560" y="510" width="360" height="130" rx="8" fill="#E8F8F0" stroke="#1e7a4c" stroke-width="1.5"/>
  <text x="740" y="530" class="title">ATTENTION &amp; REASONING BIASES</text>
  <text x="740" y="544" class="body">(looking for trouble)</text>
  <text x="740" y="564" class="body">Hypervigilant scanning for disturbing</text>
  <text x="740" y="578" class="body">visuals/situations; thinking about the</text>
  <text x="740" y="592" class="body">disturbing visual "the entire day";</text>
  <text x="740" y="606" class="body">overthinking &amp; interpersonal mistrust</text>
  <text x="740" y="624" class="body" font-style="italic">(SSCT interpersonal=20)</text>

  <line x1="240" y1="640" x2="400" y2="680" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="740" y1="640" x2="560" y2="680" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="400" y1="678" x2="240" y2="642" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="560" y1="678" x2="740" y2="642" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 5: Misinterpretations of significance -->
  <rect x="230" y="680" width="500" height="115" rx="8" fill="#FDEDEC" stroke="#b03a2e" stroke-width="1.5"/>
  <text x="480" y="700" class="title">MISINTERPRETATIONS OF SIGNIFICANCE</text>
  <text x="480" y="714" class="title">OF INTRUSIONS - RESPONSIBILITY FOR ACTIONS</text>
  <text x="480" y="734" class="body">Believes intrusive thoughts mean he is personally responsible for</text>
  <text x="480" y="748" class="body">harm to family; sexual thoughts = evidence of bad character;</text>
  <text x="480" y="762" class="body">excessive guilt &amp; disgust rather than viewing thoughts as normal</text>
  <text x="480" y="776" class="body">mental "noise"</text>

  <line x1="330" y1="795" x2="200" y2="835" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="630" y1="795" x2="760" y2="835" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="230" y1="833" x2="360" y2="798" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="730" y1="833" x2="600" y2="798" stroke="#333" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 6: Counterproductive safety strategies & Mood changes -->
  <rect x="60" y="835" width="360" height="150" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="240" y="855" class="title">COUNTERPRODUCTIVE SAFETY</text>
  <text x="240" y="869" class="title">STRATEGIES</text>
  <text x="240" y="885" class="body">(through suppression, impossible</text>
  <text x="240" y="899" class="body">criteria, avoidance)</text>
  <text x="240" y="917" class="body">Trying to suppress/avoid sexual &amp;</text>
  <text x="240" y="931" class="body">negative thoughts entirely; avoiding</text>
  <text x="240" y="945" class="body">comfortable interaction with females;</text>
  <text x="240" y="959" class="body">social withdrawal, reduced academic</text>
  <text x="240" y="973" class="body">engagement</text>

  <rect x="560" y="835" width="360" height="150" rx="8" fill="#FFF9E6" stroke="#8a6d1a" stroke-width="1.5"/>
  <text x="740" y="855" class="title">MOOD CHANGES</text>
  <text x="740" y="869" class="body">(distress, anxiety, depression)</text>
  <text x="740" y="889" class="body">BAI = 24 (moderate anxiety)</text>
  <text x="740" y="903" class="body">BDI = 30 (severe depression)</text>
  <text x="740" y="921" class="body">Persistent stress "entire day," guilt,</text>
  <text x="740" y="935" class="body">hopelessness, low self-esteem (SSCT</text>
  <text x="740" y="949" class="body">self-concept=16), and emotional</text>
  <text x="740" y="963" class="body">withdrawal / loneliness (TAT themes)</text>

  <!-- Feedback loop back up to intrusive thoughts -->
  <path d="M240,835 L240,700 L60,700 L60,410 L228,410" fill="none" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
  <path d="M740,835 L740,700 L900,700 L900,410 L732,410" fill="none" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
  <text x="480" y="1030" class="caption">Dashed red lines: maintenance loop - safety strategies and mood changes feed back into and</text>
  <text x="480" y="1046" class="caption">intensify further intrusive thoughts, perpetuating the obsessive-compulsive cycle over ~4 years</text>

  <!-- Summary box -->
  <rect x="130" y="1070" width="700" height="190" rx="8" fill="#F4F4F4" stroke="#666" stroke-width="1.2"/>
  <text x="480" y="1092" class="title">CLINICAL SUMMARY (Salkovskis Formulation)</text>
  <text x="480" y="1112" class="body">Rahul's dysfunctional belief that having a thought = being responsible for it (thought-action</text>
  <text x="480" y="1126" class="body">fusion / inflated responsibility) transforms normal intrusive thoughts into threatening obsessions.</text>
  <text x="480" y="1140" class="body">His neutralizing rituals (eye rubbing, saliva avoidance) and safety behaviors (avoidance,</text>
  <text x="480" y="1154" class="body">suppression) provide brief relief but prevent disconfirmation of his catastrophic beliefs, while</text>
  <text x="480" y="1168" class="body">attentional biases keep him scanning for "dangerous" thoughts/images. The resulting mood</text>
  <text x="480" y="1182" class="body">changes (severe depression, moderate anxiety) further lower his threshold for misinterpreting</text>
  <text x="480" y="1196" class="body">intrusions, sustaining a self-perpetuating obsessive-compulsive cycle recommended for treatment</text>
  <text x="480" y="1210" class="body">via cognitive restructuring of responsibility beliefs and ERP targeting the rituals.</text>
</svg>
