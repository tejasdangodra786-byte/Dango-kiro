<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title { font-weight: bold; font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
    .subtitle { font-weight: bold; font-size: 11px; fill: #1a1a1a; text-anchor: middle; }
    .body { font-size: 11px; fill: #333333; text-anchor: middle; }
    .caption { font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
    .heading { font-size: 20px; font-weight: bold; fill: #14497a; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1080" fill="#ffffff"/>
  <text x="450" y="30" class="heading">Case Conceptualization - Rachman's Model of OCD</text>
  <text x="450" y="50" class="caption">Mr. Rahul Ahirwar, 19 yrs (Y-BOCS = 33, Severe)</text>

  <!-- Box 1: Trigger Stimulus -->
  <rect x="300" y="70" width="300" height="90" rx="8" fill="#FFF9E6" stroke="#8a6d1a" stroke-width="1.5"/>
  <text x="450" y="88" class="title">TRIGGER STIMULUS</text>
  <text x="450" y="104" class="body">Conflict with paternal uncle</text>
  <text x="450" y="118" class="body">(symptom onset ~4 years ago);</text>
  <text x="450" y="132" class="body">later - exposure to disturbing</text>
  <text x="450" y="146" class="body">visual images</text>

  <line x1="450" y1="160" x2="450" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Unwanted intrusive thoughts -->
  <rect x="270" y="190" width="360" height="90" rx="8" fill="#FFF9E6" stroke="#8a6d1a" stroke-width="1.5"/>
  <text x="450" y="208" class="title">UNWANTED INTRUSIVE THOUGHTS</text>
  <text x="450" y="224" class="body">Recurrent thoughts of harm/death</text>
  <text x="450" y="238" class="body">befalling family members</text>
  <text x="450" y="252" class="body">Intrusive sexual thoughts about</text>
  <text x="450" y="266" class="body">girls</text>

  <line x1="450" y1="280" x2="450" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Catastrophic misinterpretation - THREAT -->
  <rect x="230" y="320" width="440" height="130" rx="8" fill="#FDEDEC" stroke="#b03a2e" stroke-width="1.5"/>
  <text x="450" y="338" class="title">CATASTROPHIC MISINTERPRETATION OF</text>
  <text x="450" y="352" class="title">SIGNIFICANCE OF THOUGHTS - THREAT</text>
  <text x="450" y="372" class="body">Thoughts seen as dangerous signs that</text>
  <text x="450" y="386" class="body">harm WILL occur; sexual thoughts viewed</text>
  <text x="450" y="400" class="body">as proof of bad character, producing</text>
  <text x="450" y="414" class="body">intense guilt and disgust</text>
  <text x="450" y="435" class="body" font-style="italic">(SSCT self-concept = 16; significant disturbance)</text>

  <!-- Left box: Responsibility -->
  <rect x="20" y="330" width="190" height="110" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="115" y="350" class="subtitle">RESPONSIBILITY</text>
  <text x="115" y="368" class="body">Excessive responsibility</text>
  <text x="115" y="382" class="body">for family's safety (SSCT</text>
  <text x="115" y="396" class="body">family area disturbed);</text>
  <text x="115" y="410" class="body">fear of harm/death to</text>
  <text x="115" y="424" class="body">relatives</text>

  <line x1="210" y1="385" x2="230" y2="385" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Right box: Thought-Action Fusion -->
  <rect x="690" y="330" width="190" height="110" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="785" y="350" class="subtitle">THOUGHT-ACTION FUSION</text>
  <text x="785" y="368" class="body">Belief that swallowing</text>
  <text x="785" y="382" class="body">saliva lets negative</text>
  <text x="785" y="396" class="body">thoughts "enter" him;</text>
  <text x="785" y="410" class="body">thinking of harm feels</text>
  <text x="785" y="424" class="body">almost like causing it</text>

  <line x1="670" y1="385" x2="690" y2="385" stroke="#333" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Divergent arrows to three boxes -->
  <line x1="450" y1="450" x2="150" y2="490" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="450" x2="450" y2="490" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="450" x2="750" y2="490" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4a: Increase in focus & attention -->
  <rect x="20" y="490" width="260" height="130" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="150" y="510" class="subtitle">INCREASE IN FOCUS</text>
  <text x="150" y="524" class="subtitle">&amp; ATTENTION</text>
  <text x="150" y="544" class="body">Hypervigilance to disturbing</text>
  <text x="150" y="558" class="body">visual; ruminates on it the</text>
  <text x="150" y="572" class="body">entire day; poor</text>
  <text x="150" y="586" class="body">concentration on academics</text>

  <!-- Box 4b: Internal sensations of anxiety -->
  <rect x="320" y="490" width="260" height="130" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="450" y="510" class="subtitle">INTERNAL SENSATIONS</text>
  <text x="450" y="524" class="subtitle">OF ANXIETY</text>
  <text x="450" y="544" class="body">Stress felt the entire day;</text>
  <text x="450" y="558" class="body">restlessness;</text>
  <text x="450" y="572" class="body">BAI = 24</text>
  <text x="450" y="586" class="body">(moderate anxiety)</text>

  <!-- Box 4c: Increase in range & seriousness -->
  <rect x="620" y="490" width="260" height="130" rx="8" fill="#EAF2FB" stroke="#2e5f8a" stroke-width="1.5"/>
  <text x="750" y="510" class="subtitle">INCREASE IN RANGE &amp;</text>
  <text x="750" y="524" class="subtitle">SERIOUSNESS OF STIMULI</text>
  <text x="750" y="544" class="body">Content spread from harm/</text>
  <text x="750" y="558" class="body">death themes to sexual</text>
  <text x="750" y="572" class="body">themes; intensified over</text>
  <text x="750" y="586" class="body">4 years</text>

  <!-- Convergent arrows to Box 5 -->
  <line x1="150" y1="620" x2="440" y2="655" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="620" x2="450" y2="655" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="620" x2="460" y2="655" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 5: Obsessions -->
  <rect x="300" y="655" width="300" height="90" rx="8" fill="#FDEDEC" stroke="#b03a2e" stroke-width="1.5"/>
  <text x="450" y="675" class="title">OBSESSIONS</text>
  <text x="450" y="693" class="body">Recurrent intrusive negative &amp;</text>
  <text x="450" y="707" class="body">sexual thoughts</text>
  <text x="450" y="724" class="body" font-weight="bold">Y-BOCS = 33 (Severe range)</text>

  <line x1="450" y1="745" x2="450" y2="775" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 6: Increase in distress & anxiety -->
  <rect x="250" y="775" width="400" height="100" rx="8" fill="#FFF9E6" stroke="#8a6d1a" stroke-width="1.5"/>
  <text x="450" y="795" class="title">INCREASE IN DISTRESS &amp; ANXIETY</text>
  <text x="450" y="813" class="body">Guilt, disgust, shame; BDI = 30</text>
  <text x="450" y="827" class="body">(severe depression); impaired</text>
  <text x="450" y="841" class="body">academic, social &amp; interpersonal</text>
  <text x="450" y="855" class="body">functioning</text>

  <line x1="450" y1="875" x2="450" y2="905" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 7: Neutralization -->
  <rect x="280" y="905" width="340" height="130" rx="8" fill="#E8F8F0" stroke="#1e7a4c" stroke-width="1.5"/>
  <text x="450" y="925" class="title">NEUTRALIZATION</text>
  <text x="450" y="943" class="body">Repeated eye rubbing to "remove"</text>
  <text x="450" y="957" class="body">the thought/visual; avoiding</text>
  <text x="450" y="971" class="body">swallowing saliva to keep thoughts</text>
  <text x="450" y="985" class="body">from "entering" him</text>
  <text x="450" y="1002" class="body" font-weight="bold" fill="#b03a2e">-&gt; Temporary relief only</text>

  <!-- Feedback loop -->
  <path d="M280,965 L40,965 L40,235 L270,235" fill="none" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowRed)"/>
  <text x="34" y="600" class="body" fill="#b03a2e" transform="rotate(-90 34 600)">Temporary relief reinforces &amp; maintains the OC cycle</text>

</svg>
