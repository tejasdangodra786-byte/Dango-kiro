<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1040" viewBox="0 0 820 1040" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="820" height="1040" fill="#ffffff"/>
<rect x="18" y="18" width="784" height="1004" rx="5" fill="#FBF4C4" stroke="#E8DE9A"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto"><path d="M0.5,0.5 L4.5,8 L8.5,0.5 Z" fill="#9BA8CC"/></marker></defs>
<text x="46" y="60" font-size="23" font-weight="bold" fill="#7A3B8F">Cognitive Model of OCD</text>
<text x="47" y="85" font-size="13.5" fill="#6b6b6b" font-style="italic">Salkovskis’ Model — applied to the case of Sapna Ahirwar (24F, OCD / F42.2)</text>
<rect x="60" y="112" width="325" height="96" rx="8" fill="#D5E2F2" stroke="#9FB4D8" stroke-width="1.4"/>
<text x="222.5" y="134" font-size="14" font-weight="bold" fill="#1F3A66" text-anchor="middle">Early Experiences</text>
<text x="222.5" y="152" font-size="11.5" fill="#2b2b2b" text-anchor="middle">(making her vulnerable to OCD)</text>
<text x="222.5" y="167.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Mother died at a very young age; lack of</text>
<text x="222.5" y="183.0" font-size="11.5" fill="#2b2b2b" text-anchor="middle">parental support; sent to live with bua &amp;</text>
<text x="222.5" y="198.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">fufaji; restricted family communication.</text>
<rect x="435" y="112" width="325" height="96" rx="8" fill="#D5E2F2" stroke="#9FB4D8" stroke-width="1.4"/>
<text x="597.5" y="134" font-size="14" font-weight="bold" fill="#1F3A66" text-anchor="middle">Critical Incidents</text>
<text x="597.5" y="152" font-size="11.5" fill="#2b2b2b" text-anchor="middle">(what started the OCD off)</text>
<text x="597.5" y="167.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Sexual assault by her grandfather and</text>
<text x="597.5" y="183.0" font-size="11.5" fill="#2b2b2b" text-anchor="middle">another relative between 15 and 18</text>
<text x="597.5" y="198.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">years of age.</text>
<text x="770" y="236" font-size="12.5" fill="#444" text-anchor="end" font-style="italic">Activates</text>
<line x1="222" y1="208" x2="222" y2="256" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<line x1="597" y1="208" x2="597" y2="256" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<rect x="170" y="258" width="480" height="104" rx="8" fill="#D5E2F2" stroke="#9FB4D8" stroke-width="1.4"/>
<text x="410.0" y="280" font-size="14" font-weight="bold" fill="#1F3A66" text-anchor="middle">Assumptions, General Beliefs</text>
<text x="410.0" y="298" font-size="11.5" fill="#2b2b2b" text-anchor="middle">“Not preventing disaster is as bad as making it happen”;</text>
<text x="410.0" y="313.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">“better safe than sorry”; inflated responsibility;</text>
<text x="410.0" y="329.0" font-size="11.5" fill="#2b2b2b" text-anchor="middle">“I am dirty / contaminated”; thought–action fusion</text>
<text x="410.0" y="344.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">(“having the thought makes me bad / dangerous”).</text>
<line x1="410" y1="362" x2="410" y2="404" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<rect x="120" y="406" width="580" height="70" rx="8" fill="#D5E2F2" stroke="#9FB4D8" stroke-width="1.4"/>
<text x="410.0" y="428" font-size="14" font-weight="bold" fill="#1F3A66" text-anchor="middle">Intrusive Thoughts, Images, Urges, Doubts</text>
<text x="410.0" y="446" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Intrusive sexual thoughts / images of people she talks to; contamination</text>
<text x="410.0" y="461.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">doubts (“dirt on my hands”); doubts about the gas and her belongings.</text>
<line x1="410" y1="476" x2="410" y2="650" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<rect x="85" y="540" width="300" height="108" rx="8" fill="#D5E2F2" stroke="#9FB4D8" stroke-width="1.4"/>
<text x="235.0" y="562" font-size="14" font-weight="bold" fill="#1F3A66" text-anchor="middle">Neutralizing Actions</text>
<text x="235.0" y="580" font-size="11.5" fill="#2b2b2b" text-anchor="middle">(rituals, reassurance, mental argument)</text>
<text x="235.0" y="595.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Repetitive handwashing &amp; bathing;</text>
<text x="235.0" y="611.0" font-size="11.5" fill="#2b2b2b" text-anchor="middle">cleaning washroom / room; checking</text>
<text x="235.0" y="626.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">gas &amp; belongings; mental neutralising.</text>
<rect x="435" y="540" width="300" height="108" rx="8" fill="#D5E2F2" stroke="#9FB4D8" stroke-width="1.4"/>
<text x="585.0" y="562" font-size="14" font-weight="bold" fill="#1F3A66" text-anchor="middle">Attention &amp; Reasoning Biases</text>
<text x="585.0" y="580" font-size="11.5" fill="#2b2b2b" text-anchor="middle">(looking for trouble)</text>
<text x="585.0" y="595.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Hypervigilance to “dirt” and to people</text>
<text x="585.0" y="611.0" font-size="11.5" fill="#2b2b2b" text-anchor="middle">as triggers; questioning others’ integrity</text>
<text x="585.0" y="626.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">after neighbourhood news.</text>
<line x1="150" y1="540" x2="150" y2="480" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<line x1="670" y1="540" x2="670" y2="480" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<rect x="170" y="666" width="480" height="76" rx="8" fill="#F7D9C4" stroke="#E0A87E" stroke-width="1.4"/>
<text x="410.0" y="688" font-size="14" font-weight="bold" fill="#8a4b22" text-anchor="middle">Misinterpretation of Significance of Intrusions</text>
<text x="410.0" y="706" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Responsibility for actions: “this thought means I am bad / dangerous”;</text>
<text x="410.0" y="721.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">“I’ll contaminate someone”; “harm will happen if I don’t check.”</text>
<line x1="235" y1="666" x2="235" y2="652" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<line x1="585" y1="666" x2="585" y2="652" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<line x1="410" y1="742" x2="410" y2="788" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<rect x="85" y="778" width="300" height="118" rx="8" fill="#D5E2F2" stroke="#9FB4D8" stroke-width="1.4"/>
<text x="235.0" y="800" font-size="14" font-weight="bold" fill="#1F3A66" text-anchor="middle">Counterproductive Safety Strategies</text>
<text x="235.0" y="818" font-size="11.5" fill="#2b2b2b" text-anchor="middle">(suppression, impossible criteria, avoidance)</text>
<text x="235.0" y="833.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Thought suppression; avoiding eye contact;</text>
<text x="235.0" y="849.0" font-size="11.5" fill="#2b2b2b" text-anchor="middle">avoiding men &amp; conversations;</text>
<text x="235.0" y="864.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">staying home / social withdrawal.</text>
<rect x="435" y="778" width="300" height="118" rx="8" fill="#DCEFD5" stroke="#A9CE9A" stroke-width="1.4"/>
<text x="585.0" y="800" font-size="14" font-weight="bold" fill="#2f6b2f" text-anchor="middle">Mood Changes</text>
<text x="585.0" y="818" font-size="11.5" fill="#2b2b2b" text-anchor="middle">(distress, anxiety, depression)</text>
<text x="585.0" y="833.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">Low mood &amp; dysphoria; death wishes;</text>
<text x="585.0" y="849.0" font-size="11.5" fill="#2b2b2b" text-anchor="middle">disturbed sleep &amp; appetite;</text>
<text x="585.0" y="864.5" font-size="11.5" fill="#2b2b2b" text-anchor="middle">markedly reduced libido.</text>
<path d="M85,835 L46,835 L46,441 L116,441" fill="none" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
<path d="M735,835 L774,835 L774,441 L704,441" fill="none" stroke="#9BA8CC" stroke-width="4" marker-end="url(#ah)"/>
</svg>